# SPDX-License-Identifier: Apache-2.0
name: Rust Embedded Workbench CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-linux:
    name: Verify Linux JDK 21
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile, test and smoke-test CLI
        run: bash scripts/verify.sh

  verify-windows:
    name: Verify Windows JDK 21
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile, test and smoke-test CLI
        shell: pwsh
        run: ./scripts/verify.ps1
