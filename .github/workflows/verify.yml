# SPDX-License-Identifier: Apache-2.0
name: Verify bootstrap
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            run: bash scripts/verify.sh
          - os: windows-latest
            shell: pwsh
            run: ./scripts/verify.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test core
        shell: ${{ matrix.shell }}
        run: ${{ matrix.run }}
