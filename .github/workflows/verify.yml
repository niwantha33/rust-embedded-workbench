# SPDX-License-Identifier: Apache-2.0
name: Rust Embedded Workbench CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rew-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-linux:
    name: Verify Linux JDK 21 and publisher tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test Java
        run: bash scripts/verify.sh
      - name: Check publisher security regressions
        run: python3 -m unittest discover -s tests/tools -p 'test_*.py' -v

  verify-windows:
    name: Verify Windows JDK 21 and publisher tests
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test Java
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Check publisher security regressions
        shell: pwsh
        run: python -m unittest discover -s tests/tools -p 'test_*.py' -v
