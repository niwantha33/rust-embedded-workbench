# SPDX-License-Identifier: Apache-2.0
name: Publish qualified signed Eclipse updates

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'plugins/**'
      - 'features/**'
      - 'releng/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pom.xml'
      - '.github/workflows/publish-updates.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rew-release-main
  cancel-in-progress: false

jobs:
  preflight:
    name: Require installable Eclipse product before publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Evidence gate for an installed, updatable p2 product
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if test -f pom.xml &&
             test -f features/io.github.niwantha33.rew.feature/feature.xml &&
             test -f releng/repository/pom.xml &&
             test -s releng/rew-update-public-key.pem &&
             test -f scripts/p2_smoke.py; then
            openssl pkey -pubin -in releng/rew-update-public-key.pem -noout
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "SKIP: No qualified installable Eclipse product / trust anchor / p2 smoke yet." >> "$GITHUB_STEP_SUMMARY"
            echo "CLI-only bootstrap is never published as an IDE update." >> "$GITHUB_STEP_SUMMARY"
          fi

  qualify:
    name: Build exact p2 site and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    needs: preflight
    if: ${{ needs.preflight.outputs.ready == 'true' }}
    outputs:
      version: ${{ steps.verify.outputs.version }}
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Regression and release-guard tests
        run: |
          bash scripts/verify.sh
          python3 -m unittest discover -s tests/tools -p 'test_*.py' -v
      - name: Clean qualified Tycho build
        run: |
          set -euo pipefail
          qualifier="$(date -u +%Y%m%d%H%M%S)"
          mvn -B -ntp -DforceContextQualifier="$qualifier" clean verify
      - name: Validate actual p2 package and Eclipse provisioning
        run: |
          set -euo pipefail
          python3 scripts/rew_update_site.py verify --site releng/repository/target/repository
          python3 scripts/p2_smoke.py --site releng/repository/target/repository
      - name: Seal verified site
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          site="releng/repository/target/repository"
          version="$(python3 scripts/rew_update_site.py verify --site "$site" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')"
          digest="$(python3 scripts/rew_update_site.py digest --site "$site")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Transfer exactly verified files to publisher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rew-verified-p2
          path: releng/repository/target/repository/
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publisher credential confined to final signed release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [preflight, qualify]
    if: ${{ needs.preflight.outputs.ready == 'true' && needs.qualify.result == 'success' }}
    environment: rew-update-publisher
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rew-verified-p2
          path: releng/repository/target/repository/
      - name: Re-verify sealed artifact and publish only signed immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          REW_UPDATE_SIGNING_KEY_PEM: ${{ secrets.REW_UPDATE_SIGNING_KEY_PEM }}
          SOURCE_SHA: ${{ github.sha }}
          EXPECTED_VERSION: ${{ needs.qualify.outputs.version }}
          EXPECTED_DIGEST: ${{ needs.qualify.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPECTED_VERSION"
          test -n "$EXPECTED_DIGEST"
          python3 scripts/publish_update.py \
            --site releng/repository/target/repository \
            --public-key releng/rew-update-public-key.pem \
            --source-sha "$SOURCE_SHA" \
            --expected-version "$EXPECTED_VERSION" \
            --expected-digest "$EXPECTED_DIGEST"
          echo "Signed immutable p2 update published; older update releases kept." >> "$GITHUB_STEP_SUMMARY"
