# SPDX-License-Identifier: Apache-2.0
name: Publish qualified public Eclipse p2 updates

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'plugins/**'
      - 'features/**'
      - 'releng/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pom.xml'
      - '.github/workflows/publish-updates.yml'
  workflow_dispatch:
  # Reconcile a missed push trigger without repeatedly publishing an unchanged commit.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: rew-public-p2-publish
  cancel-in-progress: false

jobs:
  preflight:
    name: Check complete Eclipse product and p2 qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.pending.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require installable Eclipse source and smoke test
        run: |
          set -euo pipefail
          test -f pom.xml
          test -f features/io.github.niwantha33.rew.feature/feature.xml
          test -f releng/repository/pom.xml
          test -f scripts/p2_smoke.py
          test -f scripts/publish_public_p2.py
          test -f scripts/eclipse-platform-4.41-linux.sha512
          test -f scripts/release_pending.py
      - name: Read-only check for a new main commit
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/updates:refs/remotes/origin/updates
          record="$RUNNER_TEMP/rew-previous-channel.properties"
          if git cat-file -e refs/remotes/origin/updates:public-channel.properties 2>/dev/null; then
            git show refs/remotes/origin/updates:public-channel.properties > "$record"
          fi
          python3 scripts/release_pending.py \
            --source "$GITHUB_SHA" \
            --record "$record" \
            --github-output "$GITHUB_OUTPUT"

  qualify:
    name: Build verified Eclipse p2 site (read-only)
    needs: preflight
    if: ${{ needs.preflight.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      version: ${{ steps.seal.outputs.version }}
      digest: ${{ steps.seal.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Core and public publisher safety tests
        run: |
          bash scripts/verify.sh
          python3 -m unittest discover -s tests/tools -p 'test_*.py' -v
      - name: Clean Tycho Eclipse p2 build
        run: |
          set -euo pipefail
          mvn -B -ntp -DforceContextQualifier="$(date -u +%Y%m%d%H%M%S)" clean verify
      - name: Verify p2 package layout and digests
        run: python3 scripts/rew_update_site.py verify --site releng/repository/target/repository
      - name: Download pinned Eclipse Platform for native p2 smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rew-platform"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 240 \
            https://download.eclipse.org/eclipse/downloads/drops4/R-4.41-202608281142/eclipse-platform-4.41-linux-gtk-x86_64.tar.gz \
            -o "$RUNNER_TEMP/eclipse-platform.tar.gz"
          (cd "$RUNNER_TEMP" && sha512sum --check "$GITHUB_WORKSPACE/scripts/eclipse-platform-4.41-linux.sha512")
          tar -xzf "$RUNNER_TEMP/eclipse-platform.tar.gz" -C "$RUNNER_TEMP/rew-platform"
      - name: Verify native Eclipse p2 provisioning
        run: |
          python3 scripts/p2_smoke.py \
            --java "$JAVA_HOME/bin/java" \
            --eclipse "$RUNNER_TEMP/rew-platform/eclipse" \
            --site releng/repository/target/repository
      - name: Seal exact published version and artifact digest
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          site=releng/repository/target/repository
          version="$(python3 scripts/rew_update_site.py verify --site "$site" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')"
          digest="$(python3 scripts/rew_update_site.py digest --site "$site")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Transfer qualified p2 package to publishing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualified-rew-public-p2
          path: releng/repository/target/repository/
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish public p2 with built-in GitHub token
    needs: [preflight, qualify]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualified-rew-public-p2
          path: releng/repository/target/repository/
      - name: Validate bytes and fast-forward public updates branch
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          EXPECTED_VERSION: ${{ needs.qualify.outputs.version }}
          EXPECTED_DIGEST: ${{ needs.qualify.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPECTED_VERSION"
          test -n "$EXPECTED_DIGEST"
          python3 scripts/publish_public_p2.py \
            --site releng/repository/target/repository \
            --source-sha "$SOURCE_SHA" \
            --expected-version "$EXPECTED_VERSION" \
            --expected-digest "$EXPECTED_DIGEST"
          echo "Published tested public p2 preview; unsigned bundles still require Eclipse trust approval." >> "$GITHUB_STEP_SUMMARY"
